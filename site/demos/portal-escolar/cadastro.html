<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/Cadastro.css">
    <title>Cadastro de Aluno - Portal Escolar</title>
    <link rel="stylesheet" href="../faixa.css">
    <link rel="stylesheet" href="css/demo.css">
    <script src="js/dados-demo.js"></script>
    <script src="js/demo.js"></script>
</head>
<body class="demo-centro">
<div class="faixa-demo"><span>Demonstração com dados fictícios. Nada é salvo.</span><a href="../../#p-portal-escolar">Voltar ao portfólio</a></div>
    <div class="container">
        <!-- Lado esquerdo (imagem) -->
        <div class="left-side">
            <img src="images/marca-portal.svg" alt="Imagem de Fundo">
        </div>

        <!-- Lado direito (formulário de cadastro) -->
        <div class="right-side">
            <div class="form-container">
                <h2>Cadastro</h2>
                <form action="#" data-demo="cadastrar" method="POST">
                    <!-- Nome Completo -->
                    <div class="form-group">
                        <label for="nome">Nome Completo</label>
                        <input type="text" id="nome" name="nome" required>
                    </div>

                    <!-- Data de Nascimento -->
                    <div class="form-group">
                        <label for="dataNascimento">Data de Nascimento</label>
                        <input type="date" id="data_nascimento" name="data_nascimento" required>
                    </div>

                    <!-- E-mail -->
                    <div class="form-group">
                        <label for="email">E-mail</label>
                        <input type="email" id="email" name="email" required>
                    </div>

                    <!-- Senha -->
                    <div class="form-group">
                        <label for="senha">Senha</label>
                        <input type="password" id="senha" name="senha" required>
                    </div>

                    <input type="hidden" name="cargo" value="aluno">

                    <div class="form-actions">
                        <button type="submit">Cadastrar</button>
                    </div>

                    <div class="extra-options">
                        <a href="index.html">Já tem inscrição? Login</a>
                        <a href="inicio.html">Voltar à Página Inicial</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
