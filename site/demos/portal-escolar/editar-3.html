<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Editar Usuário</title>
    <link rel="stylesheet" href="css/Editar.css">
    <link rel="stylesheet" href="../faixa.css">
    <link rel="stylesheet" href="css/demo.css">
    <script src="js/dados-demo.js"></script>
    <script src="js/demo.js"></script>
</head>
<body>
<div class="faixa-demo"><span>Demonstração com dados fictícios. Nada é salvo.</span><a href="../../#p-portal-escolar">Voltar ao portfólio</a></div>
    <h1>Editar Usuário</h1>
    <form action="#" data-demo="salvar-usuario" method="POST">
        <!-- Campo para o nome -->
        <label for="nome">Nome:</label>
        <input type="text" id="nome" name="nome" value="Patrícia Nogueira Lins" required>

        <!-- Campo para o email -->
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" value="patricia.lins@escola.example" required>

        <!-- Campo para o cargo -->
        <label for="cargo">Cargo:</label>
        <input type="text" id="cargo" name="cargo" value="professor" required>

        <!-- Seletor para associar matérias (somente se o usuário for professor) -->
        
            <label for="materias">Matérias:</label>
<select name="materias[]" id="materias" multiple required>
    
        <option value="1" >Matemática</option>
    
        <option value="2" >Língua Portuguesa</option>
    
        <option value="3" >Biologia</option>
    
        <option value="4" >Física</option>
    
        <option value="5" >Química</option>
    
        <option value="6" >História</option>
    
        <option value="7" >Geografia</option>
    
        <option value="8" >Inglês</option>
    
</select>
        

        <!-- Botão de salvar -->
        <button type="submit">Salvar</button>
    </form>

    <!-- Link de cancelar -->
    <a href="administrar.html">Cancelar</a>
</body>
</html>
