<!DOCTYPE html>
<html lang="pt-BR" data-pagina="perfil">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil do Usuário</title>
    <link rel="stylesheet" href="css/perfil.css">
    <link rel="stylesheet" href="../faixa.css">
    <link rel="stylesheet" href="css/demo.css">
    <script src="js/demo.js"></script>
</head>
<body class="demo-perfil">
<div class="faixa-demo"><span>Demonstração com dados fictícios. Nada é salvo.</span><a href="../../#p-ceilandia-times">Voltar ao portfólio</a></div>
    <header>
        <h1>Perfil do Usuário</h1>
    </header>
    
    <main>
        <section class="profile">
            <div class="profile-pic">
                <img id="userImage" src="media/usuario-2.svg" alt="Imagem do Usuário">

                <form id="updateProfileForm" action="#" data-demo="nao-salva" method="POST" enctype="multipart/form-data">
                    <label for="imagemPerfil">Upload da Imagem:</label>
                    <input type="file" id="imagemPerfil" name="imagemPerfil">
                    <button type="submit">Enviar</button>
                </form>
            </div>
            
            <div class="profile-info">
                <form id="updateProfileForm" action="#" data-demo="nao-salva" method="POST">
                    <label for="username">Nome:</label>
                    <input type="text" id="username" name="username" value="Joana Ribeiro">

                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" value="leitora@exemplo.com" disabled>

                    <button type="submit">Salvar Alterações</button>
                </form>
            </div>
        </section>
    </main>
</body>
</html>
